<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <a routerLink="/" class="inline-flex items-center gap-2 mb-8">
      <span class="w-9 h-9 rounded-lg bg-[#4A51D4] text-white font-bold flex items-center justify-center">T</span>
      <span class="text-xl font-bold text-slate-900">TILA</span>
    </a>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900">Log in</h1>
      <p class="mt-1 text-sm text-slate-500">Welcome back. Continue learning with your username.</p>

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="username">Username</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#4A51D4]/40 focus:border-[#4A51D4]"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#4A51D4]/40 focus:border-[#4A51D4]"
          />
        </div>

        @if (errorMessage()) {
          <p class="text-sm text-red-600">{{ errorMessage() }}</p>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full rounded-xl bg-[#4A51D4] text-white font-semibold py-2.5 hover:bg-[#3f45b8] disabled:opacity-60 transition-colors"
        >
          {{ submitting() ? 'Signing in…' : 'Log in' }}
        </button>
      </form>

      <p class="mt-6 text-sm text-slate-500 text-center">
        New to TILA?
        <a routerLink="/auth/register" class="text-[#4A51D4] font-semibold hover:underline">Sign up</a>
      </p>
    </div>
  </div>
</div>
