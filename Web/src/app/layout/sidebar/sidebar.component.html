<aside class="w-64 shrink-0 bg-white border-r border-slate-200 flex flex-col min-h-screen">
  <div class="px-5 pt-6 pb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-[#4A51D4] text-white font-bold flex items-center justify-center">T</div>
      <div>
        <div class="font-bold text-slate-900 leading-tight">TILA</div>
        <div class="text-[11px] text-slate-500">Intelligent Learning</div>
      </div>
    </div>

    <button
      type="button"
      class="mt-5 w-full rounded-xl bg-[#4A51D4] text-white text-sm font-semibold py-2.5 hover:bg-[#3f45b8] transition-colors"
    >
      + New Notebook
    </button>
  </div>

  <nav class="flex-1 px-3 space-y-1">
    @for (item of navItems; track item.label) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-[#EEF0FF] text-[#4A51D4]"
        [routerLinkActiveOptions]="{ exact: item.label === 'Dashboard' }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"
      >
        <span class="w-5 text-center opacity-70">•</span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="border-t border-slate-200 p-3 relative">
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50"
    >
      <span class="w-5 text-center">⌕</span>
      Search
    </button>

    <button
      type="button"
      (click)="toggleProfile()"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50"
    >
      <span class="w-7 h-7 rounded-full bg-[#EEF0FF] text-[#4A51D4] flex items-center justify-center text-xs font-bold">
        {{ (auth.user()?.name || 'U').charAt(0).toUpperCase() }}
      </span>
      <span class="truncate">User Profile</span>
    </button>

    @if (profileOpen()) {
      <div class="absolute left-3 right-3 bottom-16 bg-white border border-slate-200 rounded-xl shadow-lg p-4 z-20">
        <div class="text-sm font-semibold text-slate-900 truncate">{{ auth.user()?.name }}</div>
        <div class="text-xs text-slate-500 truncate mt-0.5">{{ auth.user()?.email }}</div>
        <div class="text-xs text-slate-400 truncate mt-0.5">&#64;{{ auth.user()?.username }}</div>
        <button
          type="button"
          (click)="signOut()"
          class="mt-3 w-full rounded-lg border border-slate-200 text-sm font-semibold text-slate-700 py-2 hover:bg-slate-50"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</aside>
