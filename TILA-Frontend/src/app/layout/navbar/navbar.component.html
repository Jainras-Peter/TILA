<header 
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [ngClass]="{
    'bg-tila-dark/85 backdrop-blur-xl border-b border-white/10 shadow-2xl py-4.5': isScrolled,
    'bg-transparent py-6': !isScrolled
  }"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between">
      
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-500 to-cyan-400 p-[1px] shadow-glow-violet group-hover:scale-105 transition-transform duration-300">
          <div class="w-full h-full bg-tila-dark rounded-[11px] flex items-center justify-center">
            <span class="font-heading font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">T</span>
          </div>
        </div>
        <span class="font-heading font-bold text-2xl tracking-tight text-white group-hover:text-purple-300 transition-colors">
          TILA<span class="text-purple-500"></span>
        </span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-8">
        <a 
          href="#features" 
          (click)="scrollTo('features', $event)"
          class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-200"
        >
          Features
        </a>
        <a 
          href="#use-cases" 
          (click)="scrollTo('use-cases', $event)"
          class="text-sm font-medium text-slate-300 hover:text-white transition-colors duration-200"
        >
          Use Cases
        </a>
      </nav>

      <!-- Right Action Buttons -->
      <div class="hidden md:flex items-center gap-3">
        <button 
          type="button" 
          class="px-5 py-2.5 text-sm font-semibold text-slate-200 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 rounded-full backdrop-blur-md transition-all duration-200 active:scale-95"
        >
          Log In
        </button>

        <button 
          type="button" 
          class="relative group px-6 py-2.5 text-sm font-semibold text-white rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 shadow-glow-violet hover:shadow-purple-500/50 transition-all duration-300 overflow-hidden active:scale-95"
        >
          <span class="relative z-10 flex items-center gap-1.5">
            Sign Up
            <svg class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
          <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 blur-sm"></div>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button 
        type="button" 
        (click)="mobileMenuOpen = !mobileMenuOpen" 
        class="md:hidden p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path *ngIf="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Mobile Menu Drawer -->
    <div 
      *ngIf="mobileMenuOpen" 
      class="md:hidden mt-4 pt-4 pb-6 border-t border-white/10 flex flex-col gap-3 animate-fadeIn"
    >
      <a 
        href="#features" 
        (click)="scrollTo('features', $event)" 
        class="px-4 py-2.5 text-base font-medium text-slate-200 hover:bg-white/5 rounded-xl"
      >
        Features
      </a>
      <a 
        href="#use-cases" 
        (click)="scrollTo('use-cases', $event)" 
        class="px-4 py-2.5 text-base font-medium text-slate-200 hover:bg-white/5 rounded-xl"
      >
        Use Cases
      </a>
      <div class="pt-2 flex flex-col gap-2.5">
        <button class="w-full py-3 text-sm font-semibold text-slate-200 bg-white/5 border border-white/10 rounded-xl">
          Log In
        </button>
        <button class="w-full py-3 text-sm font-semibold text-white bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl shadow-glow-violet">
          Sign Up
        </button>
      </div>
    </div>

  </div>
</header>
